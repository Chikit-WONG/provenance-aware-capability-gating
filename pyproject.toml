[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provenance-agent-security"
version = "0.1.0"
description = "A reproducible multi-agent indirect prompt-injection attack and defense testbed."
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
analysis = ["pandas>=2.2,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4"]
demo = ["gradio>=3.50,<4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

